<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audio Format Transcoder — OmniConvert</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23e50914'><path d='M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14l-5-5 1.41-1.41L12 14.17l5.59-5.59L19 10l-7 7z'/></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="min-h-screen flex flex-col relative selection:bg-[#e50914] selection:text-white">

    <header class="border-b border-[var(--border)] bg-[var(--bg-app)]/85 backdrop-blur-xl sticky top-0 z-40 transition-colors duration-200">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
      <a href="../index.html" class="flex items-center gap-2 group cursor-pointer text-xs font-semibold text-[var(--text-muted)] hover:text-[var(--text-main)] transition">
        <svg class="w-4 h-4 group-hover:-translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
        <span>Back to Home</span>
      </a>

      <div class="flex items-center gap-2.5">
        <button id="theme-toggle-btn" class="p-2 rounded-xl btn-ios-secondary flex items-center justify-center text-[var(--text-main)] transition" title="Toggle Light / Dark Mode">
          <svg class="w-4 h-4 hidden dark:block text-amber-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
          <svg class="w-4 h-4 block dark:hidden text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
        </button>
      </div>
    </div>
  </header>

    <main class="max-w-5xl mx-auto px-4 sm:px-6 py-8 flex-1 w-full">
    <div class="mb-6">
      <div class="flex items-center gap-3">
        <div class="ios-squircle w-11 h-11 flex-shrink-0 flex items-center justify-center bg-gradient-to-br from-[#ff2d55] via-[#e50914] to-[#80001d]">
          <svg class="w-5 h-5 text-white drop-shadow-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/></svg>
        </div>
        <div>
          <h1 class="text-xl font-bold">Audio Transcoder & Waveform</h1>
          <p class="text-xs text-[var(--text-muted)] mt-0.5">Decode MP3/OGG/AAC via Web Audio API, preview waveform, and export clean WAV</p>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="lg:col-span-2 space-y-4">
        <div id="audio-dropzone" class="ios-card p-8 ios-dropzone text-center cursor-pointer">
          <input type="file" id="audio-input" accept="audio/*" class="hidden" />
          <div class="w-12 h-12 mx-auto rounded-full bg-[var(--pill-bg)] flex items-center justify-center mb-3">
            <svg class="w-6 h-6 text-[#ff2d55]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/></svg>
          </div>
          <p class="text-sm font-semibold">Drop audio file or <label for="audio-input" class="text-[#ff2d55] underline cursor-pointer">browse</label></p>
          <p class="mt-1 text-xs text-[var(--text-dim)]">Supports MP3, WAV, OGG, AAC, FLAC</p>
        </div>

        <div class="ios-card p-5">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider">PCM Audio Waveform</span>
            <span id="audio-info" class="text-xs font-mono text-[var(--text-muted)]">No audio loaded</span>
          </div>
          <canvas id="audio-waveform" height="120" class="w-full bg-[var(--pill-bg)] rounded-xl border border-[var(--border)]"></canvas>
        </div>
      </div>

      <div>
        <div class="ios-card p-5 space-y-4">
          <h2 class="text-xs font-bold uppercase tracking-wider text-[var(--text-muted)]">Transcode Settings</h2>
          
          <div>
            <label class="block text-xs font-medium text-[var(--text-muted)] mb-1">Export Format</label>
            <select class="ios-input w-full px-3 py-2 text-xs">
              <option value="wav" selected>WAV (Uncompressed PCM, 16-bit 44.1kHz)</option>
            </select>
          </div>

          <div class="pt-2 border-t border-[var(--border)]">
            <button id="btn-export-wav" disabled class="btn-ios-primary w-full py-2.5 px-4 text-xs font-semibold">
              Export WAV Audio
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="../js/modules/audio-transcoder.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
