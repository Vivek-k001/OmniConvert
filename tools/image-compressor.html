<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Optimizer & Converter — OmniConvert</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23e50914'><path d='M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14l-5-5 1.41-1.41L12 14.17l5.59-5.59L19 10l-7 7z'/></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="min-h-screen flex flex-col relative selection:bg-[#e50914] selection:text-white">

    <header class="border-b border-[var(--border)] bg-[var(--bg-app)]/85 backdrop-blur-xl sticky top-0 z-40 transition-colors duration-200">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
      <a href="../index.html" class="flex items-center gap-2 group cursor-pointer text-xs font-semibold text-[var(--text-muted)] hover:text-[var(--text-main)] transition">
        <svg class="w-4 h-4 group-hover:-translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
        <span>Back to Home</span>
      </a>

      <div class="flex items-center gap-2.5">
        <button id="theme-toggle-btn" class="p-2 rounded-xl btn-ios-secondary flex items-center justify-center text-[var(--text-main)] transition" title="Toggle Light / Dark Mode">
          <svg class="w-4 h-4 hidden dark:block text-amber-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
          <svg class="w-4 h-4 block dark:hidden text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
        </button>
      </div>
    </div>
  </header>

    <main class="max-w-5xl mx-auto px-4 sm:px-6 py-8 flex-1 w-full">
    <div class="mb-6">
      <div class="flex items-center gap-3">
        <div class="ios-squircle w-11 h-11 flex-shrink-0 flex items-center justify-center bg-gradient-to-br from-[#ff9500] via-[#f76a00] to-[#c74c00]">
          <svg class="w-5 h-5 text-white drop-shadow-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"/></svg>
        </div>
        <div>
          <h1 class="text-xl font-bold">Image Optimizer & Converter</h1>
          <p class="text-xs text-[var(--text-muted)] mt-0.5">Compress, resize, and convert WebP, JPEG, and PNG images locally</p>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="lg:col-span-2 space-y-4">
        <div id="compress-dropzone" class="ios-card p-8 ios-dropzone text-center cursor-pointer">
          <input type="file" id="compress-input" multiple accept="image/*" class="hidden" />
          <div class="w-12 h-12 mx-auto rounded-full bg-[var(--pill-bg)] flex items-center justify-center mb-3">
            <svg class="w-6 h-6 text-[#ff9500]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          </div>
          <p class="text-sm font-semibold">Drop images to compress, or <label for="compress-input" class="text-[#ff9500] underline cursor-pointer">browse</label></p>
          <p class="mt-1 text-xs text-[var(--text-dim)]">Real-time byte calculations and zero server uploads</p>
        </div>

        <div id="compress-preview-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>

        <div id="compress-empty" class="ios-card p-8 text-center text-xs text-[var(--text-muted)]">
          No images queued for compression.
        </div>

        <div id="compress-summary" class="ios-card p-4 hidden items-center justify-between text-xs"></div>
      </div>

      <div>
        <div class="ios-card p-5 space-y-4">
          <h2 class="text-xs font-bold uppercase tracking-wider text-[var(--text-muted)]">Settings</h2>
          
          <div>
            <div class="flex justify-between text-xs font-medium text-[var(--text-muted)] mb-1">
              <span>Quality Factor</span>
              <span id="compress-quality-val" class="font-mono text-[var(--text-main)]">80%</span>
            </div>
            <input type="range" id="compress-quality" min="10" max="100" value="80" class="ios-slider w-full" />
          </div>

          <div>
            <label class="block text-xs font-medium text-[var(--text-muted)] mb-1">Target Format</label>
            <select id="compress-format" class="ios-input w-full px-3 py-2 text-xs">
              <option value="image/webp" selected>WebP (Efficient & Modern Web)</option>
              <option value="image/jpeg">JPEG (Universal Photos)</option>
              <option value="image/png">PNG (Lossless & Alpha)</option>
            </select>
            <p id="compress-format-hint" class="text-[11px] text-amber-500 mt-1 hidden"></p>
          </div>

          <div>
            <label class="block text-xs font-medium text-[var(--text-muted)] mb-1">Max Bounds (Optional Resize)</label>
            <select id="compress-max-dim" class="ios-input w-full px-3 py-2 text-xs">
              <option value="0" selected>Original Dimensions</option>
              <option value="3840">4K UHD (3840px)</option>
              <option value="1920">Full HD (1920px)</option>
              <option value="1280">HD (1280px)</option>
              <option value="800">Web Thumbnail (800px)</option>
            </select>
          </div>

          <div class="pt-2 border-t border-[var(--border)] space-y-2">
            <button id="btn-download-compress" disabled class="btn-ios-primary w-full py-2.5 px-4 text-xs font-semibold">
              Download All Processed
            </button>
            <button id="btn-clear-compress" class="btn-ios-secondary w-full py-2 px-4 text-xs font-semibold">
              Clear Queue
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="../js/modules/compressor.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
