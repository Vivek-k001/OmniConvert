<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Split & Extract — OmniConvert</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23e50914'><path d='M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14l-5-5 1.41-1.41L12 14.17l5.59-5.59L19 10l-7 7z'/></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css" />

    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body class="min-h-screen flex flex-col relative selection:bg-[#e50914] selection:text-white">

    <header class="border-b border-[var(--border)] bg-[var(--bg-app)]/85 backdrop-blur-xl sticky top-0 z-40 transition-colors duration-200">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
      <a href="../index.html" class="flex items-center gap-2 group cursor-pointer text-xs font-semibold text-[var(--text-muted)] hover:text-[var(--text-main)] transition">
        <svg class="w-4 h-4 group-hover:-translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
        <span>Back to Home</span>
      </a>

      <div class="flex items-center gap-2.5">
        <button id="theme-toggle-btn" class="p-2 rounded-xl btn-ios-secondary flex items-center justify-center text-[var(--text-main)] transition" title="Toggle Light / Dark Mode">
          <svg class="w-4 h-4 hidden dark:block text-amber-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
          <svg class="w-4 h-4 block dark:hidden text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
        </button>
      </div>
    </div>
  </header>

    <main class="max-w-5xl mx-auto px-4 sm:px-6 py-8 flex-1 w-full">
    <div class="mb-6">
      <div class="flex items-center gap-3">
        <div class="ios-squircle w-11 h-11 flex-shrink-0 flex items-center justify-center bg-gradient-to-br from-[#ff3b30] via-[#e50914] to-[#990000]">
          <svg class="w-5 h-5 text-white drop-shadow-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2" /></svg>
        </div>
        <div>
          <h1 class="text-xl font-bold">PDF Split & Extract</h1>
          <p class="text-xs text-[var(--text-muted)] mt-0.5">Preview all pages, choose custom ranges, and extract new PDFs in memory</p>
        </div>
      </div>
    </div>

        <div id="pdf-split-dropzone" class="ios-card p-8 ios-dropzone text-center cursor-pointer mb-6">
      <input type="file" id="pdf-split-input" accept=".pdf,application/pdf" class="hidden" />
      <div class="w-12 h-12 mx-auto rounded-full bg-[var(--pill-bg)] flex items-center justify-center mb-3">
        <svg class="w-6 h-6 text-[#e50914]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" /></svg>
      </div>
      <p class="text-sm font-semibold">Drop multi-page PDF here, or <label for="pdf-split-input" class="text-[#e50914] underline cursor-pointer">browse</label></p>
      <p class="mt-1 text-xs text-[var(--text-dim)]">Processed 100% in your browser without uploading to any server</p>
    </div>

        <div id="pdf-split-empty" class="ios-card p-12 text-center text-xs text-[var(--text-muted)]">
      No PDF loaded yet. Drop a PDF above to inspect and split pages.
    </div>

        <div id="pdf-split-controls" class="hidden space-y-6">
      <div class="ios-card p-4 flex flex-col sm:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-2">
          <button id="btn-split-select-all" class="btn-ios-secondary text-xs px-3 py-1.5 rounded-lg">Select All</button>
          <button id="btn-split-clear" class="btn-ios-secondary text-xs px-3 py-1.5 rounded-lg">Clear Selection</button>
        </div>
        <div class="flex items-center gap-2 w-full sm:w-auto">
          <label class="text-xs font-medium text-[var(--text-muted)] whitespace-nowrap">Page Range:</label>
          <input type="text" id="pdf-split-range" placeholder="e.g. 1, 3, 5-8" class="ios-input px-3 py-1.5 text-xs w-full sm:w-48" />
          <button id="btn-extract-pdf" class="btn-ios-primary text-xs px-4 py-1.5 whitespace-nowrap">
            Extract Pages
          </button>
        </div>
      </div>

      <div id="pdf-split-grid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 gap-3"></div>
    </div>
  </main>

  <script src="../js/modules/pdf-splitter.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
